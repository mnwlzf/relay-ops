name: relay-ops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay_ops
      POSTGRES_USER: relay_ops
      POSTGRES_PASSWORD: relay_ops
    ports:
      - "5432:5432"
    volumes:
      - relay-ops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_ops -d relay_ops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - relay-ops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  relay-ops-postgres:
  relay-ops-redis:
