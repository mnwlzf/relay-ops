name: relay-ops

services:
  postgres:
    # pgvector image: assistant memory needs the vector extension (see docs/refactor-scheduling-and-assistant.md 3.4).
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${RELAY_OPS_DB_NAME:-relay_ops}
      POSTGRES_USER: ${RELAY_OPS_DB_USERNAME:-relay_ops}
      POSTGRES_PASSWORD: ${RELAY_OPS_DB_PASSWORD:-relay_ops}
    ports:
      - "${RELAY_OPS_DB_PORT:-5432}:5432"
    volumes:
      - relay-ops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RELAY_OPS_DB_USERNAME:-relay_ops} -d ${RELAY_OPS_DB_NAME:-relay_ops}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RELAY_OPS_REDIS_PORT:-6379}:6379"
    volumes:
      - relay-ops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 后端应用：一条 docker compose up -d --build 即可起全栈
  app:
    build:
      context: ./backend
    environment:
      # 容器内用服务名互相访问，覆盖 .env 里给宿主机用的 localhost 地址
      RELAY_OPS_DB_URL: jdbc:postgresql://postgres:5432/${RELAY_OPS_DB_NAME:-relay_ops}
      RELAY_OPS_DB_USERNAME: ${RELAY_OPS_DB_USERNAME:-relay_ops}
      RELAY_OPS_DB_PASSWORD: ${RELAY_OPS_DB_PASSWORD:-relay_ops}
      RELAY_OPS_DB_IDLE_TIMEOUT: ${RELAY_OPS_DB_IDLE_TIMEOUT:-120000}
      RELAY_OPS_REDIS_HOST: redis
      RELAY_OPS_REDIS_PORT: "6379"
      RELAY_OPS_REDIS_PASSWORD: ${RELAY_OPS_REDIS_PASSWORD:-}
      RELAY_OPS_TIMEZONE: ${RELAY_OPS_TIMEZONE:-Asia/Shanghai}
      RELAY_OPS_DEV_OPEN_API: ${RELAY_OPS_DEV_OPEN_API:-false}
      RELAY_OPS_CREDENTIAL_KEY: ${RELAY_OPS_CREDENTIAL_KEY:-}
      RELAY_OPS_MONITORING_STALE_HOURS: ${RELAY_OPS_MONITORING_STALE_HOURS:-2}
      RELAY_OPS_MAIL_ENABLED: ${RELAY_OPS_MAIL_ENABLED:-false}
      RELAY_OPS_MAIL_HOST: ${RELAY_OPS_MAIL_HOST:-}
      RELAY_OPS_MAIL_PORT: ${RELAY_OPS_MAIL_PORT:-587}
      RELAY_OPS_MAIL_USERNAME: ${RELAY_OPS_MAIL_USERNAME:-}
      RELAY_OPS_MAIL_PASSWORD: ${RELAY_OPS_MAIL_PASSWORD:-}
      RELAY_OPS_MAIL_FROM: ${RELAY_OPS_MAIL_FROM:-}
      RELAY_OPS_MAIL_TO: ${RELAY_OPS_MAIL_TO:-}
      RELAY_OPS_MAIL_START_TLS: ${RELAY_OPS_MAIL_START_TLS:-true}
      RELAY_OPS_ALERT_BALANCE_THRESHOLD: ${RELAY_OPS_ALERT_BALANCE_THRESHOLD:-10}
      RELAY_OPS_ALERT_COOLDOWN: ${RELAY_OPS_ALERT_COOLDOWN:-6h}
      RELAY_OPS_ALERT_STALE_HOURS: ${RELAY_OPS_ALERT_STALE_HOURS:-2}
      # OneBot：容器内直连 napcat 服务
      RELAY_OPS_ONEBOT_ENABLED: ${RELAY_OPS_ONEBOT_ENABLED:-false}
      RELAY_OPS_ONEBOT_WEBHOOK_TOKEN: ${RELAY_OPS_ONEBOT_WEBHOOK_TOKEN:-}
      RELAY_OPS_ONEBOT_API_BASE_URL: http://napcat:3000
      RELAY_OPS_ONEBOT_API_TOKEN: ${RELAY_OPS_ONEBOT_API_TOKEN:-}
      RELAY_OPS_ONEBOT_ALLOWED_GROUPS: ${RELAY_OPS_ONEBOT_ALLOWED_GROUPS:-}
      RELAY_OPS_ONEBOT_ADMIN_USERS: ${RELAY_OPS_ONEBOT_ADMIN_USERS:-}
      RELAY_OPS_ONEBOT_ALERT_GROUPS: ${RELAY_OPS_ONEBOT_ALERT_GROUPS:-}
      RELAY_OPS_ONEBOT_REQUIRE_MENTION: ${RELAY_OPS_ONEBOT_REQUIRE_MENTION:-true}
      # 模型与向量（留空即关闭自然语言/向量能力）
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.openai.com}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-gpt-4o-mini}
      BAILIAN_EMBEDDING_ENABLED: ${BAILIAN_EMBEDDING_ENABLED:-true}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_WORKSPACE_ID: ${BAILIAN_WORKSPACE_ID:-}
      BAILIAN_EMBEDDING_MODEL: ${BAILIAN_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      JAVA_OPTS: ${RELAY_OPS_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
    ports:
      - "${RELAY_OPS_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # QQ 侧接入：OneBot v11 实现。首次启动需要扫码登录（无法自动化），
  # 之后在 NapCat WebUI 里配置「HTTP 服务端(3000)」与「反向 HTTP 上报」。
  napcat:
    image: mlikiowa/napcat-docker:latest
    environment:
      NAPCAT_ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
      - "127.0.0.1:${NAPCAT_HTTP_PORT:-3000}:3000"
    volumes:
      # 登录态与 NapCat 配置；含敏感数据，已在 .gitignore 中排除
      - ./napcat:/app/napcat
    extra_hosts:
      # 让容器能用 host.docker.internal 访问宿主机上的后端
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  relay-ops-postgres:
  relay-ops-redis:
