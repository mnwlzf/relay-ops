name: relay-ops

services:
  postgres:
    # pgvector image: assistant memory needs the vector extension (see docs/refactor-scheduling-and-assistant.md 3.4).
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${RELAY_OPS_DB_NAME:-relay_ops}
      POSTGRES_USER: ${RELAY_OPS_DB_USERNAME:-relay_ops}
      POSTGRES_PASSWORD: ${RELAY_OPS_DB_PASSWORD:-relay_ops}
    ports:
      - "${RELAY_OPS_DB_PORT:-5432}:5432"
    volumes:
      - relay-ops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RELAY_OPS_DB_USERNAME:-relay_ops} -d ${RELAY_OPS_DB_NAME:-relay_ops}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${RELAY_OPS_REDIS_PORT:-6379}:6379"
    volumes:
      - relay-ops-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  relay-ops-postgres:
  relay-ops-redis:
