server:
  port: ${RELAY_OPS_SERVER_PORT:8080}
  address: ${RELAY_OPS_SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  servlet:
    session:
      timeout: ${RELAY_OPS_SESSION_TIMEOUT:8h}
      cookie:
        name: ${RELAY_OPS_SESSION_COOKIE_NAME:RELAY_OPS_SESSION}
        http-only: ${RELAY_OPS_SESSION_COOKIE_HTTP_ONLY:true}
        same-site: ${RELAY_OPS_SESSION_COOKIE_SAME_SITE:strict}
        secure: ${RELAY_OPS_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: ${RELAY_OPS_APP_NAME:relay-ops-backend}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: ${RELAY_OPS_VIRTUAL_THREADS:true}
  datasource:
    url: ${RELAY_OPS_DB_URL:jdbc:postgresql://localhost:5432/relay_ops}
    username: ${RELAY_OPS_DB_USERNAME:relay_ops}
    password: ${RELAY_OPS_DB_PASSWORD:relay_ops}
    hikari:
      maximum-pool-size: ${RELAY_OPS_DB_POOL_SIZE:12}
      minimum-idle: ${RELAY_OPS_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${RELAY_OPS_DB_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${RELAY_OPS_DB_VALIDATION_TIMEOUT:3000}
      keepalive-time: ${RELAY_OPS_DB_KEEPALIVE_TIME:60000}
      max-lifetime: ${RELAY_OPS_DB_MAX_LIFETIME:300000}
  data:
    redis:
      host: ${RELAY_OPS_REDIS_HOST:localhost}
      port: ${RELAY_OPS_REDIS_PORT:6379}
      username: ${RELAY_OPS_REDIS_USERNAME:}
      password: ${RELAY_OPS_REDIS_PASSWORD:}
      database: ${RELAY_OPS_REDIS_DATABASE:0}
      timeout: ${RELAY_OPS_REDIS_TIMEOUT:3s}
  session:
    store-type: ${RELAY_OPS_SESSION_STORE:redis}
    timeout: ${RELAY_OPS_SESSION_TIMEOUT:8h}
    redis:
      namespace: ${RELAY_OPS_SESSION_NAMESPACE:relay-ops:session}
      flush-mode: ${RELAY_OPS_SESSION_FLUSH_MODE:on_save}
  flyway:
    enabled: ${RELAY_OPS_FLYWAY_ENABLED:true}
    locations: ${RELAY_OPS_FLYWAY_LOCATIONS:classpath:db/migration}
    validate-migration-naming: ${RELAY_OPS_FLYWAY_VALIDATE_NAMING:true}
  jackson:
    time-zone: ${RELAY_OPS_TIMEZONE:Asia/Shanghai}
    default-property-inclusion: ${RELAY_OPS_JACKSON_INCLUSION:non_null}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}

  # Quartz persists triggers in the application database (tables created by Flyway).
  # Keep initialize-schema=never: Flyway owns the schema.
  quartz:
    scheduler-name: ${RELAY_OPS_QUARTZ_SCHEDULER_NAME:relay-ops}
    auto-startup: ${RELAY_OPS_QUARTZ_AUTO_STARTUP:true}
    wait-for-jobs-to-complete-on-shutdown: ${RELAY_OPS_QUARTZ_WAIT_ON_SHUTDOWN:true}
    overwrite-existing-jobs: ${RELAY_OPS_QUARTZ_OVERWRITE_JOBS:false}
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: ${RELAY_OPS_QUARTZ_INSTANCE_ID:AUTO}
      org.quartz.threadPool.threadCount: ${RELAY_OPS_SCHEDULING_THREADS:10}
      org.quartz.jobStore.isClustered: ${RELAY_OPS_QUARTZ_CLUSTERED:true}
      org.quartz.jobStore.clusterCheckinInterval: ${RELAY_OPS_QUARTZ_CLUSTER_CHECKIN_INTERVAL:15000}
      org.quartz.jobStore.acquireTriggersWithinLock: ${RELAY_OPS_QUARTZ_ACQUIRE_TRIGGERS_WITHIN_LOCK:true}
      org.quartz.jobStore.misfireThreshold: ${RELAY_OPS_QUARTZ_MISFIRE_THRESHOLD:60000}
      org.quartz.jobStore.selectWithLockSQL: SELECT * FROM {0}LOCKS WHERE SCHED_NAME = {1} AND LOCK_NAME = ? FOR UPDATE

mybatis-plus:
  mapper-locations: ${RELAY_OPS_MAPPER_LOCATIONS:classpath*:/mapper/**/*.xml}
  type-handlers-package: ${RELAY_OPS_TYPE_HANDLERS_PACKAGE:com.relayops.infrastructure.persistence.mybatis.handler}
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: ${RELAY_OPS_ACTUATOR_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: ${RELAY_OPS_ACTUATOR_PROBES:true}
  info:
    env:
      enabled: ${RELAY_OPS_ACTUATOR_INFO_ENV:true}

info:
  app:
    name: ${RELAY_OPS_APP_TITLE:RelayOps}
    description: ${RELAY_OPS_APP_DESCRIPTION:Upstream API operations platform}

logging:
  level:
    root: ${RELAY_OPS_LOG_LEVEL:INFO}
    com.relayops: ${RELAY_OPS_APP_LOG_LEVEL:INFO}
    org.quartz: ${RELAY_OPS_QUARTZ_LOG_LEVEL:WARN}
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

# Optional Sub2API read-only database. The main application database remains
# spring.datasource and is the only source used by MyBatis-Plus and Flyway.
relay-ops:
  timezone: ${RELAY_OPS_TIMEZONE:Asia/Shanghai}
  security:
    # 仅本地开发用：identity 尚未落地时让前端能直接调 /api/**。生产必须保持 false；
    # 本地联调时在 .env 里设 RELAY_OPS_DEV_OPEN_API=true。
    dev-open: ${RELAY_OPS_DEV_OPEN_API:false}
    cors-origins: ${RELAY_OPS_CORS_ORIGINS:http://localhost:5173}
  scheduling:
    enabled: ${RELAY_OPS_SCHEDULING_ENABLED:true}
    zone: ${RELAY_OPS_SCHEDULING_ZONE:Asia/Shanghai}
    default-calendar: ${RELAY_OPS_SCHEDULING_CALENDAR:cn-official}
    execution-timeout: ${RELAY_OPS_SCHEDULING_EXECUTION_TIMEOUT:5m}
    silent-alert-grace: ${RELAY_OPS_SCHEDULING_SILENT_GRACE:15m}
    preview-count: ${RELAY_OPS_SCHEDULING_PREVIEW_COUNT:10}
    shift-horizon-days: ${RELAY_OPS_SCHEDULING_SHIFT_HORIZON_DAYS:30}
  monitoring:
    # 超过该小时数未成功采集即视为沉默，进入异常账号列表
    stale-hours: ${RELAY_OPS_MONITORING_STALE_HOURS:2}
  notification:
    mail:
      enabled: ${RELAY_OPS_MAIL_ENABLED:false}
      host: ${RELAY_OPS_MAIL_HOST:}
      port: ${RELAY_OPS_MAIL_PORT:587}
      username: ${RELAY_OPS_MAIL_USERNAME:}
      password: ${RELAY_OPS_MAIL_PASSWORD:}
      from: ${RELAY_OPS_MAIL_FROM:}
      to: ${RELAY_OPS_MAIL_TO:}
      start-tls: ${RELAY_OPS_MAIL_START_TLS:true}
    alerts:
      # 余额低于该值触发告警；负数表示关闭余额告警
      balance-threshold: ${RELAY_OPS_ALERT_BALANCE_THRESHOLD:10}
      cooldown: ${RELAY_OPS_ALERT_COOLDOWN:6h}
      stale-hours: ${RELAY_OPS_ALERT_STALE_HOURS:2}
  onebot:
    # 未启用时 webhook 返回 404、发送只写日志；启用需要同时配置 token 与 api-base-url
    enabled: ${RELAY_OPS_ONEBOT_ENABLED:false}
    webhook-token: ${RELAY_OPS_ONEBOT_WEBHOOK_TOKEN:}
    api-base-url: ${RELAY_OPS_ONEBOT_API_BASE_URL:http://localhost:3000}
    api-token: ${RELAY_OPS_ONEBOT_API_TOKEN:}
    # 群白名单（逗号分隔）；留空表示不限制，建议正式部署时显式配置
    allowed-groups: ${RELAY_OPS_ONEBOT_ALLOWED_GROUPS:}
    # QQ 号白名单：这些人在群里被当作管理员（可查平台数据）
    admin-users: ${RELAY_OPS_ONEBOT_ADMIN_USERS:}
    # 主动告警推送目标群（逗号分隔）；留空则只发邮件
    alert-groups: ${RELAY_OPS_ONEBOT_ALERT_GROUPS:}
    group-mention-required: ${RELAY_OPS_ONEBOT_REQUIRE_MENTION:true}
    timeout: ${RELAY_OPS_ONEBOT_TIMEOUT:5s}
  upstream:
    # 账号凭证的 AES-GCM 密钥（base64，16/24/32 字节）。留空则无法保存凭证。
    credential-key: ${RELAY_OPS_CREDENTIAL_KEY:}
  ai:
    chat:
      # ModelRouter 自行构建客户端；SPRING_AI_MODEL_CHAT 只影响 Spring AI 自动装配。
      enabled: ${RELAY_OPS_AI_CHAT_ENABLED:false}
      primary:
        base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${SPRING_AI_OPENAI_API_KEY:}
        model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
        temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}
        max-tokens: ${RELAY_OPS_AI_CHAT_MAX_TOKENS:1024}
      fallback:
        base-url: ${RELAY_OPS_AI_CHAT_FALLBACK_BASE_URL:}
        api-key: ${RELAY_OPS_AI_CHAT_FALLBACK_API_KEY:}
        model: ${RELAY_OPS_AI_CHAT_FALLBACK_MODEL:}
        temperature: ${RELAY_OPS_AI_CHAT_FALLBACK_TEMPERATURE:0.2}
        max-tokens: ${RELAY_OPS_AI_CHAT_FALLBACK_MAX_TOKENS:1024}
    embedding:
      enabled: ${BAILIAN_EMBEDDING_ENABLED:true}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      workspace-id: ${BAILIAN_WORKSPACE_ID:}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${BAILIAN_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${BAILIAN_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${BAILIAN_EMBEDDING_BATCH_SIZE:16}
      timeout: ${BAILIAN_EMBEDDING_TIMEOUT:10s}
  datasource:
    sub2-read-only:
      enabled: ${SUB2API_DB_ENABLED:false}
      url: ${SUB2API_DB_URL:}
      username: ${SUB2API_DB_USERNAME:}
      password: ${SUB2API_DB_PASSWORD:}
      connect-timeout: ${SUB2API_DB_CONNECT_TIMEOUT:5s}
      query-timeout: ${SUB2API_DB_QUERY_TIMEOUT:30s}
      realtime-query-timeout: ${SUB2API_DB_REALTIME_QUERY_TIMEOUT:3s}
      maximum-pool-size: ${SUB2API_DB_POOL_SIZE:2}
      minimum-idle: ${SUB2API_DB_MIN_IDLE:1}
      batch-size: ${SUB2API_DB_BATCH_SIZE:2000}
      max-batches-per-run: ${SUB2API_DB_MAX_BATCHES_PER_RUN:20}
      unavailable-cooldown: ${SUB2API_DB_UNAVAILABLE_COOLDOWN:30s}
      realtime-max-rows: ${SUB2API_DB_REALTIME_MAX_ROWS:500}
