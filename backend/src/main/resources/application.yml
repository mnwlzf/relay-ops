server:
  port: ${RELAY_OPS_SERVER_PORT:8080}
  address: ${RELAY_OPS_SERVER_ADDRESS:0.0.0.0}
  shutdown: graceful
  servlet:
    session:
      timeout: ${RELAY_OPS_SESSION_TIMEOUT:8h}
      cookie:
        name: ${RELAY_OPS_SESSION_COOKIE_NAME:RELAY_OPS_SESSION}
        http-only: true
        same-site: strict
        secure: ${RELAY_OPS_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: relay-ops-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${RELAY_OPS_DB_URL:jdbc:postgresql://localhost:5432/relay_ops}
    username: ${RELAY_OPS_DB_USERNAME:relay_ops}
    password: ${RELAY_OPS_DB_PASSWORD:relay_ops}
    hikari:
      maximum-pool-size: ${RELAY_OPS_DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      keepalive-time: 60000
      max-lifetime: 300000
  data:
    redis:
      host: ${RELAY_OPS_REDIS_HOST:localhost}
      port: ${RELAY_OPS_REDIS_PORT:6379}
      username: ${RELAY_OPS_REDIS_USERNAME:}
      password: ${RELAY_OPS_REDIS_PASSWORD:}
      timeout: 3s
  session:
    store-type: redis
    timeout: ${RELAY_OPS_SESSION_TIMEOUT:8h}
    redis:
      namespace: ${RELAY_OPS_SESSION_NAMESPACE:relay-ops:session}
      flush-mode: on_save
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}

  # Quartz persists triggers in the application database (tables created by Flyway).
  # Keep initialize-schema=never: Flyway owns the schema.
  quartz:
    scheduler-name: relay-ops
    auto-startup: true
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: ${RELAY_OPS_SCHEDULING_THREADS:10}
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.acquireTriggersWithinLock: true
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.jobStore.selectWithLockSQL: SELECT * FROM {0}LOCKS WHERE SCHED_NAME = {1} AND LOCK_NAME = ? FOR UPDATE

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.relayops.infrastructure.persistence.mybatis.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: RelayOps
    description: Upstream API operations platform

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

# Optional Sub2API read-only database. The main application database remains
# spring.datasource and is the only source used by MyBatis-Plus and Flyway.
relay-ops:
  scheduling:
    enabled: ${RELAY_OPS_SCHEDULING_ENABLED:true}
    zone: ${RELAY_OPS_SCHEDULING_ZONE:Asia/Shanghai}
    default-calendar: ${RELAY_OPS_SCHEDULING_CALENDAR:cn-official}
    execution-timeout: ${RELAY_OPS_SCHEDULING_EXECUTION_TIMEOUT:5m}
    silent-alert-grace: ${RELAY_OPS_SCHEDULING_SILENT_GRACE:15m}
    preview-count: ${RELAY_OPS_SCHEDULING_PREVIEW_COUNT:10}
    shift-horizon-days: ${RELAY_OPS_SCHEDULING_SHIFT_HORIZON_DAYS:30}
  ai:
    embedding:
      enabled: ${BAILIAN_EMBEDDING_ENABLED:true}
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      workspace-id: ${BAILIAN_WORKSPACE_ID:}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${BAILIAN_EMBEDDING_MODEL:text-embedding-v4}
      dimensions: ${BAILIAN_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${BAILIAN_EMBEDDING_BATCH_SIZE:16}
      timeout: ${BAILIAN_EMBEDDING_TIMEOUT:10s}
  datasource:
    sub2-read-only:
      enabled: ${SUB2API_DB_ENABLED:false}
      url: ${SUB2API_DB_URL:}
      username: ${SUB2API_DB_USERNAME:}
      password: ${SUB2API_DB_PASSWORD:}
      connect-timeout: ${SUB2API_DB_CONNECT_TIMEOUT:5s}
      query-timeout: ${SUB2API_DB_QUERY_TIMEOUT:30s}
      realtime-query-timeout: ${SUB2API_DB_REALTIME_QUERY_TIMEOUT:3s}
      maximum-pool-size: ${SUB2API_DB_POOL_SIZE:2}
      minimum-idle: ${SUB2API_DB_MIN_IDLE:1}
      batch-size: ${SUB2API_DB_BATCH_SIZE:2000}
      max-batches-per-run: ${SUB2API_DB_MAX_BATCHES_PER_RUN:20}
      unavailable-cooldown: ${SUB2API_DB_UNAVAILABLE_COOLDOWN:30s}
      realtime-max-rows: ${SUB2API_DB_REALTIME_MAX_ROWS:500}
